# Airflow 3.3.2 cluster, derived from the official reference compose file:
# https://airflow.apache.org/docs/apache-airflow/3.3.2/docker-compose.yaml
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# Deliberate deviations from the upstream reference:
#
#   1. LocalExecutor instead of CeleryExecutor. This project runs a handful of
#      ingestion DAGs on one host, so the redis broker, celery worker, and
#      flower services upstream ships are dropped. The triggerer is kept so
#      deferrable operators still work.
#   2. DAGs/plugins/logs are mounted from ./airflow/* rather than ./*, matching
#      this repository's layout, and blueprints are mounted alongside the DAGs.
#   3. Extra services this project needs: the banking source Postgres, MinIO,
#      and the Iceberg REST catalog with its own Postgres.
#   4. LOAD_EXAMPLES and DAGS_ARE_PAUSED_AT_CREATION are flipped off/on so the
#      project's own DAGs are the only ones present and are runnable on sight.
#
# Supported variables (see .env.example):
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.3.2
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account.
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account.
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Defaulted below to this project's requirements.
---
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.2}
  # build: .
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    #
    # These are reinstalled on EVERY container start, which costs startup time and
    # needs network access on each boot. The durable alternative is to bake
    # airflow/requirements.txt into an image (see airflow/Dockerfile) and
    # uncomment the `build:` line above in place of `image:`.
    #
    # apache-airflow-providers-fab is required, not optional: it supplies the
    # FabAuthManager that AIRFLOW__CORE__AUTH_MANAGER above resolves, plus the
    # `airflow users` CLI the init container uses.
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      ${_PIP_ADDITIONAL_REQUIREMENTS:-
      airflow-blueprint>=0.5.0
      apache-airflow-providers-fab>=3.9.0
      apache-airflow-providers-postgres>=7.0.2
      apache-airflow-providers-amazon>=9.36.0
      pyiceberg[s3fs,pyarrow]>=0.6.0
      pyarrow>=15.0.0
      psycopg2-binary>=2.9.9
      s3fs>=2024.3.1
      boto3>=1.34.0
      pydantic>=2.0.0
      faker>=22.0.0
      }
    # Project-specific: credentials and endpoints the blueprint tasks read.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
    ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
    AIRFLOW_VAR_repo_path: /app
    AIRFLOW_VAR_contracts_dir: contracts/current
    AIRFLOW_VAR_github_token: ${GITHUB_TOKEN:-}
    AIRFLOW_VAR_github_repo: ${GITHUB_REPO:-}
  volumes:
    # This project keeps DAGs under airflow/ rather than at the repo root, and
    # Blueprint classes live outside the DAGs folder (see airflow/dags/loader.py).
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/blueprints:/opt/airflow/blueprints
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/contracts:/app/contracts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    container_name: airflow-apiserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow-scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    container_name: airflow-dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    container_name: airflow-triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # Creates the source-database connection the ingestion blueprints read.
  # Upstream's reference file has no equivalent; it runs after airflow-init so
  # the metadata DB exists, and is idempotent on re-runs.
  airflow-connections:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow connections delete 'postgres_banking' 2>/dev/null || true
        airflow connections add 'postgres_banking' \
          --conn-type 'postgres' \
          --conn-host 'postgres-banking' \
          --conn-schema 'bankingdb' \
          --conn-login 'bankinguser' \
          --conn-password 'bankingpass' \
          --conn-port '5432'
        echo "Airflow connections created successfully!"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    container_name: airflow-cli
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # ---------------------------------------------------------------------------
  # Project services (no upstream equivalent)
  # ---------------------------------------------------------------------------

  # Source Postgres database (for data ingestion)
  postgres-banking:
    image: postgres:15-alpine
    container_name: postgres-banking
    environment:
      POSTGRES_USER: bankinguser
      POSTGRES_PASSWORD: bankingpass
      POSTGRES_DB: bankingdb
    volumes:
      - postgres_banking_data:/var/lib/postgresql/data
      - ./banking-app/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bankinguser"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: always

  # MinIO (S3-compatible storage for Iceberg)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # MinIO setup (create bucket)
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/iceberg-warehouse --ignore-existing;
      mc anonymous set public myminio/iceberg-warehouse;
      exit 0;
      "

  # Dedicated Postgres backing the Iceberg REST catalog.
  # Separate from the Airflow metadata database so the catalog has its own
  # volume, backup boundary, and lifecycle - dropping Airflow's data can never
  # orphan the Iceberg tables sitting in MinIO.
  postgres-catalog:
    image: postgres:15-alpine
    container_name: postgres-catalog
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    restart: always

  # Fetches the Postgres JDBC driver for the REST catalog (not bundled in the image).
  iceberg-rest-init:
    image: curlimages/curl:latest
    container_name: iceberg-rest-init
    user: "0:0"
    volumes:
      - jdbc_drivers:/opt/jdbc
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /opt/jdbc/postgresql.jar ]; then
          curl -fsSL -o /opt/jdbc/postgresql.jar \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
        fi
        chmod 0644 /opt/jdbc/postgresql.jar

  # Iceberg REST catalog - persists table pointers in Postgres (iceberg_catalog db).
  # Runs as its own service to keep the catalog's dependencies and JDBC driver
  # out of the Airflow image (Airflow 3 is on sqlalchemy>=2.0, so PyIceberg's SQL
  # catalog would no longer conflict, but the separation is still worth keeping).
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    # The fixture image ships no JDBC drivers, so the Postgres driver is
    # fetched into a shared volume by iceberg-rest-init and added to the
    # classpath here (`java -jar` ignores -cp, hence the explicit main class).
    entrypoint: ["java", "-cp", "/usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/opt/jdbc/postgresql.jar", "org.apache.iceberg.rest.RESTCatalogServer"]
    volumes:
      - jdbc_drivers:/opt/jdbc:ro
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://iceberg-warehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-catalog:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres-catalog:
        condition: service_healthy
      minio:
        condition: service_healthy
      iceberg-rest-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
  postgres_catalog_data:
  postgres_banking_data:
  minio_data:
  jdbc_drivers:
