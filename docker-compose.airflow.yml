version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.11.0-python3.11
  environment:
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
    AIRFLOW__CORE__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__DATABASE__SQLALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__UNIT_TEST_MODE: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: change-me-in-production
    PYTHONUNBUFFERED: '1'
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
    ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
    AIRFLOW_VAR_repo_path: /app
    AIRFLOW_VAR_contracts_dir: contracts/current
    AIRFLOW_VAR_github_token: ${GITHUB_TOKEN}
    AIRFLOW_VAR_github_repo: ${GITHUB_REPO}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/tasks:/opt/airflow/tasks
    - ./airflow/lib:/opt/airflow/lib
    - ./airflow/blueprints:/opt/airflow/blueprints
    - ./contracts:/app/contracts:ro
    - ./airflow/requirements.txt:/requirements.txt
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:
    &airflow-depends-on
    postgres:
      condition: service_healthy
    postgres-banking:
      condition: service_healthy
    minio:
      condition: service_healthy
    iceberg-rest:
      condition: service_started
  env_file:
    - .env
  networks:
    - airflow-net

services:
  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - airflow-net

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chmod 777 /opt/airflow/logs /opt/airflow/plugins

        # Install additional Python dependencies
        if [ -f /requirements.txt ]; then
          pip install --no-cache-dir -r /requirements.txt
        fi

        if [[ ! -f /opt/airflow/.airflow_db_initialized ]]; then
          airflow db migrate
          airflow users create \
            --username admin \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com \
            --password admin || true

          # Create Postgres source connection
          airflow connections add 'postgres_banking' \
            --conn-type 'postgres' \
            --conn-host 'postgres-banking' \
            --conn-schema 'bankingdb' \
            --conn-login 'bankinguser' \
            --conn-password 'bankingpass' \
            --conn-port '5432' || true

          touch /opt/airflow/.airflow_db_initialized
        fi
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/tasks:/opt/airflow/tasks
      - ./airflow/lib:/opt/airflow/lib
      - ./airflow/blueprints:/opt/airflow/blueprints
      - ./airflow/requirements.txt:/requirements.txt
      - ./contracts:/app/contracts:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      <<: *airflow-depends-on
    networks:
      - airflow-net

  # Source Postgres database (for data ingestion)
  postgres-banking:
    image: postgres:15-alpine
    container_name: postgres-banking
    environment:
      POSTGRES_USER: bankinguser
      POSTGRES_PASSWORD: bankingpass
      POSTGRES_DB: bankingdb
    volumes:
      - postgres_banking_data:/var/lib/postgresql/data
      - ./banking-app/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bankinguser"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - airflow-net

  # MinIO (S3-compatible storage for Iceberg)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # MinIO setup (create bucket)
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/iceberg-warehouse --ignore-existing;
      mc anonymous set public myminio/iceberg-warehouse;
      exit 0;
      "
    networks:
      - airflow-net

  # Dedicated Postgres backing the Iceberg REST catalog.
  # Separate from the Airflow metadata database so the catalog has its own
  # volume, backup boundary, and lifecycle - dropping Airflow's data can never
  # orphan the Iceberg tables sitting in MinIO.
  postgres-catalog:
    image: postgres:15-alpine
    container_name: postgres-catalog
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    networks:
      - airflow-net

  # Fetches the Postgres JDBC driver for the REST catalog (not bundled in the image).
  iceberg-rest-init:
    image: curlimages/curl:latest
    container_name: iceberg-rest-init
    user: "0:0"
    volumes:
      - jdbc_drivers:/opt/jdbc
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /opt/jdbc/postgresql.jar ]; then
          curl -fsSL -o /opt/jdbc/postgresql.jar \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
        fi
        chmod 0644 /opt/jdbc/postgresql.jar
    networks:
      - airflow-net

  # Iceberg REST catalog - persists table pointers in Postgres (iceberg_catalog db).
  # Runs as its own service because PyIceberg's SQL catalog needs sqlalchemy>=2.0,
  # which conflicts with Airflow 2.11's sqlalchemy<2.0 pin.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    # The fixture image ships no JDBC drivers, so the Postgres driver is
    # fetched into a shared volume by iceberg-rest-init and added to the
    # classpath here (`java -jar` ignores -cp, hence the explicit main class).
    entrypoint: ["java", "-cp", "/usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/opt/jdbc/postgresql.jar", "org.apache.iceberg.rest.RESTCatalogServer"]
    volumes:
      - jdbc_drivers:/opt/jdbc:ro
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://iceberg-warehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-catalog:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres-catalog:
        condition: service_healthy
      minio:
        condition: service_healthy
      iceberg-rest-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - airflow-net

networks:
  airflow-net:
    driver: bridge

volumes:
  jdbc_drivers:
  postgres_data:
  postgres_catalog_data:
  postgres_banking_data:
  minio_data:
  airflow_logs:
  airflow_plugins: